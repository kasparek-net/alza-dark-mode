<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#1c1f3a"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#5fae3f"/>
      <stop offset="1" stop-color="#25481c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff9c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe680" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#c9d3ff">
      <circle cx="70" cy="86" r="4"/>
      <circle cx="150" cy="44" r="3"/>
      <circle cx="226" cy="98" r="2.5"/>
      <circle cx="44" cy="190" r="2.5"/>
      <circle cx="300" cy="40" r="3"/>
      <circle cx="470" cy="210" r="3"/>
    </g>

    <!-- moon -->
    <circle cx="410" cy="100" r="50" fill="#ffe27a"/>
    <circle cx="432" cy="84" r="46" fill="#0d1226"/>


    <!-- antennae -->
    <g stroke="#2c5221" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M200 170 Q180 120 150 104"/>
      <path d="M312 170 Q332 120 362 104"/>
    </g>
    <circle cx="148" cy="102" r="20" fill="#3d7a2b"/>
    <circle cx="364" cy="102" r="20" fill="#3d7a2b"/>

    <!-- body -->
    <path d="M150 512 Q160 380 256 380 Q352 380 362 512 Z" fill="#244419"/>

    <!-- head -->
    <ellipse cx="256" cy="282" rx="150" ry="128" fill="url(#skin)"/>

    <!-- nightcap -->
    <path d="M128 232 Q170 120 300 150 Q400 170 430 250 Q440 280 418 286 Q380 200 300 196 Q200 192 140 258 Z" fill="#3949ab"/>
    <path d="M128 232 Q118 262 140 258" fill="#3949ab"/>
    <path d="M300 150 Q420 130 470 190" stroke="#3949ab" stroke-width="34" stroke-linecap="round" fill="none"/>
    <circle cx="474" cy="196" r="22" fill="#e8eaf6"/>
    <path d="M132 246 Q200 182 300 184 Q390 186 424 272" stroke="#e8eaf6" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- eye glow -->
    <circle cx="200" cy="292" r="80" fill="url(#glow)" opacity="0.35"/>
    <circle cx="312" cy="292" r="80" fill="url(#glow)" opacity="0.35"/>

    <!-- eyes -->
    <ellipse cx="200" cy="292" rx="44" ry="52" fill="#fffde7"/>
    <ellipse cx="312" cy="292" rx="44" ry="52" fill="#fffde7"/>
    <ellipse cx="210" cy="302" rx="20" ry="26" fill="#0b1022"/>
    <ellipse cx="322" cy="302" rx="20" ry="26" fill="#0b1022"/>
    <circle cx="218" cy="290" r="7" fill="#fff"/>
    <circle cx="330" cy="290" r="7" fill="#fff"/>

    <!-- grin -->
    <path d="M222 364 Q256 386 290 364" stroke="#132810" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- hand with flashlight -->
    <g transform="rotate(-24 380 380)">
      <path d="M430 366 L540 320 L540 432 L430 386 Z" fill="url(#beam)"/>
      <rect x="340" y="356" width="78" height="40" rx="10" fill="#555c66"/>
      <rect x="410" y="350" width="22" height="52" rx="6" fill="#8a929e"/>
      <rect x="350" y="364" width="10" height="24" rx="3" fill="#e53935"/>
    </g>
    <circle cx="352" cy="394" r="24" fill="#3d7a2b"/>
  </g>
</svg>
